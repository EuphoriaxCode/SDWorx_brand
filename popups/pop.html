<!doctype html><meta charset="utf-8">
<style>@font-face{font-family:"SD Worx Display VF";src:url(sdw.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
:root{--e:cubic-bezier(.65,0,.35,1);--accent:#006dd8;--ink:#fff;--dark:#040d14}
.pop{position:absolute;bottom:96px;display:flex;align-items:center;justify-content:center;height:112px;padding:0 72px;background:var(--dark);border-radius:32px;
font-family:"SD Worx Display VF",sans-serif;color:var(--ink);overflow:hidden;animation:card 5.5s var(--e) both}
.name{position:relative;font-weight:400;font-size:48px;line-height:56px;white-space:nowrap;animation:name 5.5s var(--e) both}
.bar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--accent);animation:bar 5.5s var(--e) both}
.fill{position:absolute;inset:0;background:var(--accent);transform-origin:bottom;animation:fill 5.5s var(--e) both}
.name b{font-weight:700}
.left{left:96px;--from:inset(-40px 100% -40px 0)}.left .bar{transform-origin:left}
.center{left:50%;translate:-50% 0;--from:inset(-40px 50% -40px 50%)}.center .bar{transform-origin:center}
.right{right:96px;--from:inset(-40px 0 -40px 100%)}.right .bar{transform-origin:right}
@keyframes card{0%,2.7%{clip-path:var(--from)}11.8%,83.6%{clip-path:inset(-40px)}94.5%,100%{clip-path:var(--from)}}
@keyframes bar{0%{transform:scaleX(0)}9.1%,100%{transform:scaleX(1)}}
@keyframes name{0%,7.3%{opacity:0;transform:translateY(10px)}14.5%,100%{opacity:1;transform:none}}
@keyframes fill{0%,72.7%{transform:scaleY(0)}83.6%,100%{transform:scaleY(1)}}
body.still *{animation:none!important}body.still .fill{display:none}
</style>
<div class="pop" id="p"><div class="name" id="n"></div><div class="bar"></div><div class="fill"></div></div>
<script>const q=new URLSearchParams(location.search);if(q.get('c'))document.documentElement.style.setProperty('--accent','#'+q.get('c'));{const [a,...r]=q.get('n').split(' ');const n=document.getElementById('n');n.append(a+' ');const b=document.createElement('b');b.textContent=r.join(' ');n.append(b)}document.getElementById('p').classList.add(q.get('pos'));if(q.get('still'))document.body.className='still'</script>
